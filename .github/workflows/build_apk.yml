name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      # Redmi 9C (32-bit) -> armeabi-v7a, Redmi 8 Pro (64-bit) -> arm64-v8a
      - name: Build release APKs (split per ABI)
        run: flutter build apk --release --split-per-abi --target-platform android-arm,android-arm64

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 14
